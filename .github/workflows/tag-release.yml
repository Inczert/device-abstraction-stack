name: Auto Tag Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  tag:
    name: Tag VERSION after main CI
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate VERSION and create tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" != "$CI_SHA" ]]; then
            echo "CI completed for stale main commit $CI_SHA; current main is $current_main"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION '$version'; expected MAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          tag="v$version"
          grep -Fx "## $version" CHANGELOG.md >/dev/null
          test -f "release/$tag.md"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$CI_SHA" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tagged_sha" != "$CI_SHA" ]]; then
              echo "$tag already exists at $tagged_sha; VERSION must be bumped for a new release."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag and its GitHub Release already exist."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "$tag exists at the current main commit but has no GitHub Release; packaging will be retried."
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$CI_SHA" -m "DAS $tag"
          git push origin "refs/tags/$tag"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  package:
    name: Package tagged release
    needs: tag
    if: needs.tag.outputs.publish == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      release_sha: ${{ needs.tag.outputs.release_sha }}
