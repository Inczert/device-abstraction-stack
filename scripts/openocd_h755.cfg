# ST-LINK over SWD. Kept intentionally conservative for first-contact bring-up.
source [find interface/stlink.cfg]
transport select hla_swd

# STM32H755 dual-bank target. DAS validation currently runs on CM7 only.
source [find target/stm32h7x_dual_bank.cfg]

# Attach under reset so a broken image cannot outrun the debugger.
reset_config srst_only srst_nogate connect_assert_srst
adapter speed 400
