# ST-LINK direct DAP over SWD for STM32H755 dual-core qualification.
# HLA mode is intentionally not used here because OpenOCD cannot expose both
# Cortex-M targets through HLA.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# STM32H755 has dual flash banks and two Cortex-M cores. The target script
# exposes CM7 as cpu0/GDB :3333 and CM4 as cpu1/GDB :3334.
set DUAL_CORE 1
source [find target/stm32h7x_dual_bank.cfg]

# Keep reset conservative. connect_assert_srst is deliberately omitted for the
# direct-DAP dual-core path; the campaign probes both cores before programming.
reset_config srst_only srst_nogate
adapter speed 400
